spring:
  application:
    name: bookstore
  jpa:
    hibernate:
      ddl-auto: update
  config:
    import: optional:file:.env[.properties]

  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

  springdoc:
    api-docs:
      path: /api-docs
      enabled: true

    swagger-ui:
      path: /swagger-ui.html